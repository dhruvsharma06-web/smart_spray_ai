services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartspray
      POSTGRES_USER: smartspray
      POSTGRES_PASSWORD: smartspray
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartspray -d smartspray"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://smartspray:smartspray@db:5432/smartspray
      AI_SERVICE_URL: http://mock-ai:8001
      DECISION_SERVICE_URL: http://decision:8002
      GENAI_SERVICE_URL: http://mock-genai:8003
      JWT_SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mock-ai:
        condition: service_started
      mock-decision:
        condition: service_started
      decision:
        condition: service_started
      mock-genai:
        condition: service_started
    volumes:
      - ./storage:/app/storage

  decision:
    image: python:3.12-slim
    working_dir: /srv
    volumes:
      - ../decision:/srv
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn pydantic &&
      uvicorn main:app --host 0.0.0.0 --port 8002"
    ports:
      - "8002:8002"

  mock-ai:
    image: python:3.12-slim
    working_dir: /srv
    volumes:
      - ./mock_ai:/srv
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn python-multipart &&
      uvicorn main:app --host 0.0.0.0 --port 8001"

  mock-decision:
    image: python:3.12-slim
    working_dir: /srv
    volumes:
      - ./mock_decision:/srv
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
      uvicorn main:app --host 0.0.0.0 --port 8002"

  mock-genai:
    image: python:3.12-slim
    working_dir: /srv
    volumes:
      - ./mock_genai:/srv
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
      uvicorn main:app --host 0.0.0.0 --port 8003"

volumes:
  postgres_data: