name: flutter_app
description: Smart Spray AI farmer application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera & image
  camera: ^0.12.1
  image_picker: ^1.1.2

  # State management
  flutter_riverpod: ^3.3.2

  # Networking
  dio: ^5.11.0
  http: ^1.4.0

  # Navigation
  go_router: ^17.5.0

  # Local storage
  shared_preferences: ^2.5.3

  # Charts
  fl_chart: ^1.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Date/time formatting
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/